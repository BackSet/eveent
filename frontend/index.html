<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS crítico: evita destello sin estilo antes de que cargue el bundle -->
    <style id="critical-css">
      html { color-scheme: dark; }
      html.dark,
      html.dark body {
        margin: 0;
        background-color: hsl(240, 10%, 3.9%);
        color: hsl(240, 10%, 92%);
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100dvh;
      }
      html:not(.app-ready) {
        visibility: hidden;
      }
      html.app-ready {
        visibility: visible;
      }
    </style>
    <title>__SEO_APP_NAME__ - Gestión Deportiva</title>
    <meta name="description" content="__SEO_APP_DESCRIPTION__" />
    <meta name="theme-color" content="#09090b" />
    <link rel="canonical" href="__SEO_SITE_URL__/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SEO_APP_NAME__" />
    <meta property="og:title" content="__SEO_APP_NAME__ - Gestión de convocatorias deportivas" />
    <meta property="og:description" content="__SEO_APP_DESCRIPTION__" />
    <meta property="og:url" content="__SEO_SITE_URL__/" />
    <meta property="og:image" content="__SEO_SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SEO_APP_NAME__ - Gestión de convocatorias deportivas" />
    <meta name="twitter:description" content="__SEO_APP_DESCRIPTION__" />
    <meta name="twitter:image" content="__SEO_SITE_URL__/og-image.png" />

    __SEO_GOOGLE_VERIFICATION_META__

    <!-- Fuentes sin bloquear el primer render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=optional"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=optional"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
