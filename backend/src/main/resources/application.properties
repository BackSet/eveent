spring.application.name=event-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Esquema en prod: Flyway (application-prod). En dev: Hibernate ddl-auto=update.
spring.flyway.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Origin,Accept,X-Requested-With}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization}
app.cors.max-age=${CORS_MAX_AGE:3600}

server.port=${SERVER_PORT:8080}