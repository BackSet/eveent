# Perfil producción (Railway / Docker)
# Base de datos: solo DATABASE_URL (ver ProdDatabaseConfig).

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${PORT:${SERVER_PORT:8080}}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Opcional si SPA y API comparten el mismo dominio (despliegue unificado)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Origin,Accept,X-Requested-With}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization}
app.cors.max-age=${CORS_MAX_AGE:3600}

security.headers.hsts.enabled=true

admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_INITIAL_PASSWORD}
app.admin.nombre=${ADMIN_NOMBRE:Super Admin}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
