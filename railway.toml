# Servicio único en Railway (repositorio raíz).
# 1. Añade PostgreSQL al proyecto.
# 2. Crea un servicio desde este repo (sin Root Directory, o Root Directory = /).
# 3. Variables: ver railway.env.example

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
